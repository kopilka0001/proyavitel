<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проявитель+</title>
    <style>
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            color: #f0c987;
            font-weight: 500;
            font-size: 2rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        button {
            background: #f0c987;
            color: #1a1a1a;
            border: none;
            padding: 14px 36px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        button:hover {
            background: #e0b870;
        }
        #output {
            margin-top: 2rem;
            font-size: 1.4rem;
            color: #a0d8a0;
            min-height: 2rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Проявитель+</h1>

    <button id="checkBtn">Проверить окружение</button>

    <div id="output"></div>

    <script>
        // Ждём, пока страница полностью загрузится
        document.addEventListener('DOMContentLoaded', function() {
            const btn = document.getElementById('checkBtn');
            const output = document.getElementById('output');

            btn.addEventListener('click', function() {
                // Меняем текст в поле вывода
                output.textContent = 'окружение готово';
            });
        });
    </script>

</body>
</html>
